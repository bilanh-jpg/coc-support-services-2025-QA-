.wrap{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:16px 16px 40px}

.diff{font-weight:700}.up{color:#0f8a5f}.dn{color:var(--red)}

a{color:var(--pri)}

const FN={g:"fig1_overall",c1:"fig2_items",c2:"fig3_radar",c3:"fig4_groups"},FI={g:1,c1:2,c2:3,c3:4};
function frame(w,h,k,draw){const S=2,hd=76*S,ft=48*S,c=document.createElement('canvas');c.width=w;c.height=h+hd+ft;const x=c.getContext('2d');x.fillStyle=css('--card');x.fillRect(0,0,c.width,c.height);x.textBaseline='middle';x.fillStyle=css('--tx');x.font=`700 ${22*S}px 'Noto Sans Thai',sans-serif`;x.fillText(t('f'+FI[k])+' '+t('n'+FI[k]),24*S,hd*.38);x.fillStyle=css('--mut');x.font=`${15*S}px 'Noto Sans Thai',sans-serif`;x.fillText(nm(cur)+' (n='+cur[2]+')',24*S,hd*.75);draw(x,hd);x.textAlign='left';x.textBaseline='middle';x.fillStyle=css('--mut');x.font=`${13*S}px 'Noto Sans Thai',sans-serif`;x.fillText(t('sh'),24*S,hd+h+ft/2);return c}
function gauge(){const m=cur[5],Lv=lv(m);return frame(1200,520,'g',(x,o)=>{const cx=600,cy=o+400,R=330;x.lineWidth=56;x.lineCap='round';x.strokeStyle=css('--bd');x.beginPath();x.arc(cx,cy,R,Math.PI,2*Math.PI);x.stroke();x.strokeStyle=Lv[1];x.beginPath();x.arc(cx,cy,R,Math.PI,Math.PI+Math.PI*m/5);x.stroke();x.textAlign='center';x.fillStyle=css('--tx');x.font="800 150px 'Noto Sans Thai',sans-serif";x.fillText(f(m),cx,cy-80);x.fillStyle=css('--mut');x.font="34px 'Noto Sans Thai',sans-serif";x.fillText(t('of5'),cx,cy+10);const s=t('lvl')+t('L'+Lv[0]);x.font="700 38px 'Noto Sans Thai',sans-serif";const w=x.measureText(s).width+70;x.fillStyle=Lv[1];x.beginPath();x.roundRect(cx-w/2,cy+50,w,66,33);x.fill();x.fillStyle='#fff';x.fillText(s,cx,cy+84)})}
function toast(s,ms){const e=document.createElement('div');e.textContent=s;e.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#12303a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:9';document.body.appendChild(e);setTimeout(()=>e.remove(),ms||3500)}
function doPrint(){try{window.focus();window.print()}catch(e){}if(window.self!==window.top)setTimeout(()=>toast(t('printHint'),9000),500)}
const dlp=(window.claude&&claude.use)?claude.use('downloads').catch(()=>null):Promise.resolve(null);
async function saveBlob(b,n){const D=await dlp;if(D){await D.save({filename:n,data:b});return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
document.querySelectorAll('.dl').forEach(b=>b.style.display='inline-block');
async function dl(k){try{let c;if(k==='g')c=gauge();else{const s=ch[+k[1]-1].canvas;c=frame(s.width,s.height,k,(x,o)=>x.drawImage(s,0,o))}const b=await new Promise(r=>c.toBlob(r,'image/png'));await saveBlob(b,`${FN[k]}_${cur[0]}_${lang}.png`)}catch(e){if(!e||e.code!=='declined')toast(t('fail'))}}
document.addEventListener('click',e=>{if(e.target.closest('#thm')){toggleTheme();return}const b=e.target.closest('.dl');if(b){dl(b.dataset.f);return}const g=e.target.closest('.tab');if(g){show(g.dataset.id);return}const l=e.target.closest('[data-lg]');l&&setLang(l.dataset.lg)});
function countUp(m){const ga=document.getElementById('ga'),off=282.7*(1-m/5);if(matchMedia('(prefers-reduced-motion: reduce)').matches){gm.textContent=f(m);ga.style.strokeDashoffset=off;return}ga.style.transition='none';ga.style.strokeDashoffset=282.7;void ga.getBoundingClientRect();ga.style.transition='stroke-dashoffset 1s ease, stroke .4s';ga.style.strokeDashoffset=off;const t0=performance.now();(function s(n){const p=Math.min(1,(n-t0)/900),e=1-Math.pow(1-p,3);if(p<1){gm.textContent=(m*e).toFixed(2);requestAnimationFrame(s)}else gm.textContent=f(m)})(t0)}
function isDark(){const a=document.documentElement.dataset.theme;return a?a==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function toggleTheme(){const n=isDark()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}show(cur[0])}
try{const sv=localStorage.getItem('theme');if(sv==='dark'||sv==='light')document.documentElement.dataset.theme=sv}catch(e){}
if('IntersectionObserver' in window)new IntersectionObserver(([e])=>stk.classList.toggle('on',!e.isIntersecting&&e.boundingClientRect.top<0)).observe(tabs);
{const[h,hl]=(location.hash||'').slice(1).split('/');let sv=null;try{sv=localStorage.getItem('lang')}catch(e){}lang=(hl==='en'||hl==='th')?hl:(sv==='en'||sv==='th')?sv:'th';cur=D.find(x=>x[0]===h)||ALL;stat();show(cur[0])}
</script></body></html>
